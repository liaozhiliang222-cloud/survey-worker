name = "survey-worker"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"


[[env.production.d1_databases]]
binding = "RESEARCH_DB"
database_name = "surveykit-research"
database_id = "060a28fc-72da-4ee1-940c-cea4ccca8583"

[[env.production.r2_buckets]]
binding = "RESEARCH_FILES"
bucket_name = "surveykit-research-files"

