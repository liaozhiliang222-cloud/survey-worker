name = "survey-worker"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-02"

[placement]
mode = "smart"

[[env.production.d1_databases]]
binding = "RESEARCH_DB"
database_name = "surveykit-research"
database_id = "060a28fc-72da-4ee1-940c-cea4ccca8583"

[[env.production.r2_buckets]]
binding = "RESEARCH_FILES"
bucket_name = "surveykit-research-files"

[env.production.vars]
PPTX_BACKEND_URL = "https://ppt-api.surveykit.cc"
SURVEYKIT_RELEASE = "v0.3.1-20260828.2"
SURVEYKIT_DEPLOYED_AT = "2026-08-28T07:37:45Z"
HARNESS_API_STYLE = "dsh-rpc"
HARNESS_AGENT_PRESET = "survey-research"
HARNESS_MODEL_PROVIDER = "newapi"
HARNESS_MODEL = "deepseek-v4-flash"
HARNESS_REASONING_EFFORT = ""
HARNESS_CLIENT_TIME_ZONE = "Asia/Shanghai"
# Keep synchronous AI requests below Cloudflare's client-facing 100 second timeout.
HARNESS_POLL_INTERVAL = "2000"
HARNESS_TIMEOUT = "80000"
HARNESS_LONG_TASK_TIMEOUT = "85000"
RESEARCH_AUTH_MODE = "anonymous"
RESEARCH_ANONYMOUS_USER_ID = "shared-workspace"
RESEARCH_MAX_FILE_BYTES = "10485760"
RESEARCH_MAX_FILES_PER_PROJECT = "30"
RESEARCH_MAX_PARSED_CHARS = "250000"
RESEARCH_FILE_SUMMARY_CHARS = "2000"
RESEARCH_MAX_CONTEXT_CHARS = "30000"
RESEARCH_MAX_PROJECT_CONTEXT_CHARS = "6000"
RESEARCH_MAX_ARTIFACT_CHARS = "12000"
RESEARCH_MAX_FILE_SUMMARY_CHARS = "2000"
RESEARCH_MAX_FILE_EXCERPT_CHARS = "3000"
RESEARCH_MAX_SELECTED_FILES = "8"
RESEARCH_MEMORY_CHUNK_CHARS = "1800"
RESEARCH_MEMORY_CHUNK_OVERLAP = "180"
RESEARCH_MAX_CHUNKS_PER_FILE = "48"
RESEARCH_MAX_RETRIEVED_CHUNKS = "5"
RESEARCH_MAX_RETRIEVED_CHUNK_CHARS = "1600"
RESEARCH_MAX_RECENT_MESSAGES = "6"
RESEARCH_MAX_RECENT_MESSAGE_CHARS = "1200"
RESEARCH_AI_REQUESTS_PER_MINUTE = "12"
RESEARCH_AI_REQUESTS_PER_DAY = "500"
